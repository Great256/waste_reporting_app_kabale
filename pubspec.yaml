name: waste_reporting_app
description: A mobile app to report waste in Kabale District
publish_to: 'none' # Remove this line if publishing to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  firebase_core: 4.2.1
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.4
  image_picker: ^1.2.1
  google_maps_flutter: ^2.14.0
  google_maps_flutter_web: ^0.5.14+3
  geolocator: ^14.0.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
